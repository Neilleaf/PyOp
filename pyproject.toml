[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "pyop"
version = "0.1.0"
description = "PyOp curated Python benchmarking and profiling engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[project.scripts]
pyop = "pyop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/engine/src/pyop"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
